<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>クロード使いデイリーノーツ</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--sub:#5b616b;--line:#d9d6cc;--accent:#c4642d;--err:#b4554a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16181c;--card:#1f2228;--ink:#e8e6e1;--sub:#a3a8b0;--line:#3a3e46;--accent:#e08a55;--err:#e08a80}}
:root[data-theme="dark"]{--bg:#16181c;--card:#1f2228;--ink:#e8e6e1;--sub:#a3a8b0;--line:#3a3e46;--accent:#e08a55;--err:#e08a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.7}
main{max-width:420px;margin:12vh auto 0;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px}
h1{font-size:1.2rem;margin:0 0 4px}
p{margin:0 0 14px;color:var(--sub);font-size:.9rem}
input[type=password]{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label.rm{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.9rem;color:var(--sub)}
button{width:100%;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}
.err{color:var(--err);font-size:.9rem;min-height:1.4em;margin-top:8px}
</style></head>
<body><main id="lock" hidden><form class="card" id="f">
<h1>クロード使いデイリーノーツ</h1>
<p>パスワードを入れると読めます。</p>
<input type="password" id="pw" autocomplete="current-password" aria-label="パスワード">
<label class="rm"><input type="checkbox" id="rm" checked> この端末では次から入れない</label>
<button type="submit">開く</button>
<div class="err" id="err"></div>
</form></main>

function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function toB64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function store(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
function load(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function sload(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssave(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
async function open(raw){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var d=b64(DATA);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));
  var html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:hex(SALT),iterations:ITER,hash:"SHA-256"},base,256);
}
async function start(){
  var saved=load(KEYNAME)||sload(KEYNAME);
  if(saved){try{await open(b64(saved));return;}catch(e){store(KEYNAME,null);}}
  document.getElementById("lock").hidden=false;
  document.getElementById("pw").focus();
}
document.getElementById("f").addEventListener("submit",async function(ev){
  ev.preventDefault();
  var err=document.getElementById("err");err.textContent="確かめています…";
  try{
    var raw=await derive(document.getElementById("pw").value.trim());
    var k=toB64(raw);
    ssave(KEYNAME,k);
    if(document.getElementById("rm").checked)store(KEYNAME,k);
    await open(raw);
  }catch(e){err.textContent="パスワードがちがうようです。もう一度入れてください。";}
});
if(!window.crypto||!crypto.subtle){document.getElementById("lock").hidden=false;document.getElementById("err").textContent="このブラウザでは開けません。";}
else start();
})();
